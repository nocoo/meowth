# Slot jobs (called by CI under job key `quality`); commands decoupled from base-ci quality.yml.
name: Quality Slots

on:
  workflow_call:

permissions:
  contents: read

jobs:
  s1-typecheck:
    name: "S1: Types"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: S1 dashboard typecheck
        run: pnpm dashboard:typecheck
      - name: S1 daemon vet
        run: pnpm daemon:vet
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/golangci-lint
          key: ${{ runner.os }}-golangci-lint-2.14.0
      - name: Install verified golangci-lint
        run: |
          set -euo pipefail
          BIN_DIR="${HOME}/.local/share/golangci-lint"
          mkdir -p "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$PATH"
          if [ ! -x "$BIN_DIR/golangci-lint" ] || ! "$BIN_DIR/golangci-lint" version 2>/dev/null | grep -qF "2.14.0"; then
            curl --fail --silent --show-error --location --retry 3 \
              https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz \
              -o "$RUNNER_TEMP/golangci-lint.tar.gz"
            echo "ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab  $RUNNER_TEMP/golangci-lint.tar.gz" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/golangci-lint.tar.gz" -C "$BIN_DIR" --strip-components=1 golangci-lint-2.14.0-linux-amd64/golangci-lint
            chmod +x "$BIN_DIR/golangci-lint"
          fi
          "$BIN_DIR/golangci-lint" version | grep -qF "2.14.0"
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
      - run: pnpm run lint
      - run: pnpm daemon:fmt:check
      - name: S2 daemon lint
        working-directory: daemon
        run: golangci-lint run
      - run: pnpm dashboard:fmt:check
      - run: pnpm dashboard:lint
      - run: pnpm dashboard:depcruise
      - run: pnpm scan:dashboard-source
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow-lint:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/lint-workflows@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secret-scan:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/scan-secrets@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependency-vulnerabilities:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/scan-dependencies@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
        with:
          lockfiles: "pnpm-lock.yaml,daemon/go.mod"
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: B1 pnpm daemon:build darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
        run: pnpm daemon:build
      - name: Upload darwin/arm64 daemon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: b1-daemon
          path: daemon/meowthd
          retention-days: 1
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Windows cross-compile (docs/features/06-experimental-windows.md)
  b1-build-windows-amd64:
    name: "B1: Build (Windows amd64)"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: compile daemon for windows/amd64
        working-directory: daemon
        env:
          GOOS: windows
          GOARCH: amd64
        run: go test -exec true ./...
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build-windows-arm64:
    name: "B1: Build (Windows arm64)"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: compile daemon for windows/arm64
        working-directory: daemon
        env:
          GOOS: windows
          GOARCH: arm64
        run: go test -exec true ./...
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-daemon:
    name: "L1: Unit (Daemon)"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: L1 daemon unit tests and coverage
        run: |
          (cd daemon && go test ./... -count=1 -coverprofile=coverage.out -covermode=count)
          bash scripts/check-daemon-coverage.sh
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-dashboard:
    name: "L1: Unit (Dashboard)"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
      - name: L1 dashboard unit tests and coverage
        run: pnpm dashboard:test:cover && pnpm dashboard:cover:check
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — not a Worker project"

  l3-integration:
    name: "L3: Integration"
    needs: [b1-build]
    runs-on: macos-26
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: Download B1 daemon artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: b1-daemon
          path: daemon
      - name: Prepare prebuilt daemon binary
        run: chmod +x daemon/meowthd
      - name: L3 daemon HTTP/CLI matrices (fake backends)
        env:
          MEOWTH_PREBUILT_DAEMON: ${{ github.workspace }}/daemon/meowthd
        run: pnpm test:l2
      - name: L3 embedded dashboard serving
        env:
          MEOWTH_PREBUILT_DAEMON: ${{ github.workspace }}/daemon/meowthd
        run: pnpm test:l2:embed
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l4-e2e:
    name: "L4: E2E"
    needs: [b1-build]
    runs-on: macos-26
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: Download B1 daemon artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: b1-daemon
          path: daemon
      - name: Prepare prebuilt daemon binary
        run: chmod +x daemon/meowthd
      - name: Setup Playwright
        uses: nocoo/base-ci/.github/actions/setup-playwright@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
        with:
          working-directory: "apps/dashboard"
          package-manager: "pnpm"
          browsers: "chromium"
      - name: L4 Playwright smoke suite
        env:
          MEOWTH_PREBUILT_DAEMON: ${{ github.workspace }}/daemon/meowthd
        run: pnpm --filter @meowth/dashboard e2e
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  p1-package-check:
    name: "P1: Package Check"
    if: ${{ vars.ENABLE_P1 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — private packages, not published to npm"

  z1-gate:
    name: "Z1: Gate"
    runs-on: ubuntu-latest
    needs:
      - s1-typecheck
      - s2-lint
      - s3-workflow-lint
      - g1-secret-scan
      - g2-dependency-vulnerabilities
      - b1-build
      - b1-build-windows-amd64
      - b1-build-windows-arm64
      - l1-unit-daemon
      - l1-unit-dashboard
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package-check
    if: always()
    outputs:
      tested-sha: ${{ steps.gate.outputs.tested-sha }}
    steps:
      - name: Verify required and skipped slots
        id: gate
        uses: nocoo/base-ci/.github/actions/z1-gate@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
        with:
          needs-json: ${{ toJSON(needs) }}
          expected-sha: ${{ github.sha }}
          required-jobs: |
            s1-typecheck=S1: Types
            s2-lint=S2: Lint
            s3-workflow-lint=S3: Workflow
            g1-secret-scan=G1: Secrets
            g2-dependency-vulnerabilities=G2: Dependencies
            b1-build=B1: Build
            b1-build-windows-amd64=B1: Build (Windows amd64)
            b1-build-windows-arm64=B1: Build (Windows arm64)
            l1-unit-daemon=L1: Unit (Daemon)
            l1-unit-dashboard=L1: Unit (Dashboard)
            l3-integration=L3: Integration
            l4-e2e=L4: E2E
          skipped-jobs: |
            l2-runtime=L2: Runtime
            p1-package-check=P1: Package Check
