# macOS native slot jobs (called by CI under job key `quality`); commands decoupled from base-ci quality.yml.
name: Quality Slots

on:
  workflow_call:

permissions:
  contents: read

jobs:
  s1-typecheck:
    name: "S1: Typecheck"
    runs-on: macos-26
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: S1 dashboard typecheck
        run: pnpm dashboard:typecheck
      - name: S1 daemon vet
        run: pnpm daemon:vet
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
      - run: pnpm test:hooks
      - run: pnpm daemon:fmt:check
      - run: pnpm daemon:lint
      - run: pnpm dashboard:fmt:check
      - run: pnpm dashboard:lint
      - run: pnpm dashboard:depcruise
      - run: pnpm scan:dashboard-source
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow-lint:
    name: "S3: Workflow Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflow syntax
        run: |
          "${RUNNER_TEMP}/actionlint" .github/workflows/ci.yml .github/workflows/quality-slots.yml
      - name: Check immutable shared workflow references
        run: |
          python3 - <<'PY'
          import pathlib, re, yaml
          files = list(pathlib.Path(".github/workflows").glob("*.y*ml"))
          references = []
          for path in files:
              data = yaml.safe_load(path.read_text())
              for job in data.get("jobs", {}).values():
                  references.extend(item["uses"] for item in [job, *job.get("steps", [])] if "uses" in item)
          for ref in references:
              if ref.startswith("nocoo/base-ci/") and not re.fullmatch(r"nocoo/base-ci/[^@]+@[a-f0-9]{40}", ref):
                  raise SystemExit(f"Shared CI reference must use a full commit SHA: {ref}")
          required = ".github/workflows/quality-slots.yml"
          if not any(required in ref for ref in references):
              raise SystemExit(f"Missing required reusable workflow: {required}")
          print(f"Validated {len(files)} workflow files and immutable base-ci references")
          PY
      - name: Check YAML style
        run: |
          python3 -m pip install --quiet "yamllint==1.38.0"
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}" .github/workflows/*.yml
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secret-scan:
    name: "G1: Secret Scan"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: G1 gitleaks detect
        run: pnpm scan:gitleaks:detect
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependency-vulnerabilities:
    name: "G2: Dependency Vulnerabilities"
    runs-on: macos-26
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: Install osv-scanner
        run: brew install osv-scanner
      - name: G2 OSV lockfile scan
        run: pnpm scan:osv
      - name: G2 govulncheck
        run: pnpm scan:govulncheck
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: B1 pnpm daemon:build darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
        run: pnpm daemon:build
      - name: B1 pnpm daemon:build darwin/amd64
        env:
          GOOS: darwin
          GOARCH: amd64
        run: pnpm daemon:build
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-tests:
    name: "L1: Unit Tests & Coverage"
    runs-on: macos-26
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: Install ripgrep
        run: brew install ripgrep
      - name: L1 daemon unit tests and coverage
        run: pnpm daemon:test:cover && pnpm daemon:cover:check
      - name: L1 dashboard unit tests and coverage
        run: pnpm dashboard:test:cover && pnpm dashboard:cover:check
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — not a Worker project"

  l3-integration:
    name: "L3: Integration"
    runs-on: macos-26
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: L3 daemon HTTP/CLI matrices (fake backends)
        run: pnpm test:l2
      - name: L3 embedded dashboard serving
        run: pnpm daemon:build && pnpm test:l2:embed
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l4-e2e:
    name: "L4: E2E"
    runs-on: macos-26
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/dashboard/package.json') }}
      - name: L4 install Playwright browsers
        run: pnpm --filter @meowth/dashboard e2e:install
      - name: L4 Playwright (UI + embed + embed-mint)
        run: pnpm --filter @meowth/dashboard e2e --project=dashboard-ui --project=dashboard-embed --project=dashboard-embed-mint
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  p1-package-check:
    name: "P1: Package Check"
    if: ${{ vars.ENABLE_P1 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — private packages, not published to npm"

  # Outside slot taxonomy (docs/features/06-experimental-windows.md)
  compile-windows:
    name: compile-windows
    runs-on: macos-26
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: compile daemon for windows/amd64
        working-directory: daemon
        env:
          GOOS: windows
          GOARCH: amd64
        run: go test -exec true ./...
      - name: compile daemon for windows/arm64
        working-directory: daemon
        env:
          GOOS: windows
          GOARCH: arm64
        run: go test -exec true ./...
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  z1-gate:
    name: "Z1: Gate"
    runs-on: ubuntu-latest
    needs:
      - s1-typecheck
      - s2-lint
      - s3-workflow-lint
      - g1-secret-scan
      - g2-dependency-vulnerabilities
      - b1-build
      - l1-unit-tests
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package-check
      - compile-windows
    if: always()
    steps:
      - name: "Z1: Require every implemented slot job on this commit"
        env:
          S1_RESULT: ${{ needs.s1-typecheck.result }}
          S2_RESULT: ${{ needs.s2-lint.result }}
          S3_RESULT: ${{ needs.s3-workflow-lint.result }}
          G1_RESULT: ${{ needs.g1-secret-scan.result }}
          G2_RESULT: ${{ needs.g2-dependency-vulnerabilities.result }}
          B1_RESULT: ${{ needs.b1-build.result }}
          L1_RESULT: ${{ needs.l1-unit-tests.result }}
          L2_RESULT: ${{ needs.l2-runtime.result }}
          L3_RESULT: ${{ needs.l3-integration.result }}
          L4_RESULT: ${{ needs.l4-e2e.result }}
          P1_RESULT: ${{ needs.p1-package-check.result }}
          WIN_RESULT: ${{ needs.compile-windows.result }}
          S1_SHA: ${{ needs.s1-typecheck.outputs.tested-sha }}
          S2_SHA: ${{ needs.s2-lint.outputs.tested-sha }}
          S3_SHA: ${{ needs.s3-workflow-lint.outputs.tested-sha }}
          G1_SHA: ${{ needs.g1-secret-scan.outputs.tested-sha }}
          G2_SHA: ${{ needs.g2-dependency-vulnerabilities.outputs.tested-sha }}
          B1_SHA: ${{ needs.b1-build.outputs.tested-sha }}
          L1_SHA: ${{ needs.l1-unit-tests.outputs.tested-sha }}
          L3_SHA: ${{ needs.l3-integration.outputs.tested-sha }}
          L4_SHA: ${{ needs.l4-e2e.outputs.tested-sha }}
          WIN_SHA: ${{ needs.compile-windows.outputs.tested-sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          require_success() {
            local label="$1" result="$2"
            if [ "$result" != success ]; then
              echo "::error::Z1: Gate — $label result was '$result' (expected success)."
              exit 1
            fi
          }
          require_skipped() {
            local label="$1" result="$2"
            if [ "$result" != skipped ]; then
              echo "::error::Z1: Gate — $label result was '$result' (expected skipped)."
              exit 1
            fi
          }
          require_success "S1: Typecheck" "$S1_RESULT"
          require_success "S2: Lint" "$S2_RESULT"
          require_success "S3: Workflow Lint" "$S3_RESULT"
          require_success "G1: Secret Scan" "$G1_RESULT"
          require_success "G2: Dependency Vulnerabilities" "$G2_RESULT"
          require_success "B1: Build" "$B1_RESULT"
          require_success "L1: Unit Tests & Coverage" "$L1_RESULT"
          require_skipped "L2: Runtime" "$L2_RESULT"
          require_success "L3: Integration" "$L3_RESULT"
          require_success "L4: E2E" "$L4_RESULT"
          require_skipped "P1: Package Check" "$P1_RESULT"
          require_success "compile-windows" "$WIN_RESULT"
          for sha in "$S1_SHA" "$S2_SHA" "$S3_SHA" "$G1_SHA" "$G2_SHA" "$B1_SHA" "$L1_SHA" "$L3_SHA" "$L4_SHA" "$WIN_SHA"; do
            if [ "$sha" != "$EXPECTED_SHA" ]; then
              echo "::error::Z1: Gate — tested-sha mismatch (got '$sha', expected '$EXPECTED_SHA')."
              exit 1
            fi
          done
          echo "Z1: Gate — all slots match declaration on $EXPECTED_SHA"
