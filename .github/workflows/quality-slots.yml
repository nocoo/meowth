# Slot jobs (called by CI under job key `quality`); commands decoupled from base-ci quality.yml.
name: Quality Slots

on:
  workflow_call:

permissions:
  contents: read

jobs:
  s1-typecheck:
    name: "S1: Types"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7  # v2026.17
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: S1 dashboard typecheck
        run: pnpm dashboard:typecheck
      - name: S1 daemon vet
        run: pnpm daemon:vet
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7  # v2026.17
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/golangci-lint
          key: ${{ runner.os }}-golangci-lint-2.14.0
      - name: Install verified golangci-lint
        run: |
          set -euo pipefail
          BIN_DIR="${HOME}/.local/share/golangci-lint"
          mkdir -p "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$PATH"
          if [ ! -x "$BIN_DIR/golangci-lint" ] || ! "$BIN_DIR/golangci-lint" version 2>/dev/null | grep -qF "2.14.0"; then
            curl --fail --silent --show-error --location --retry 3 \
              https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz \
              -o "$RUNNER_TEMP/golangci-lint.tar.gz"
            echo "ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab  $RUNNER_TEMP/golangci-lint.tar.gz" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/golangci-lint.tar.gz" -C "$BIN_DIR" --strip-components=1 golangci-lint-2.14.0-linux-amd64/golangci-lint
            chmod +x "$BIN_DIR/golangci-lint"
          fi
          "$BIN_DIR/golangci-lint" version | grep -qF "2.14.0"
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
      - run: pnpm run lint
      - run: pnpm daemon:fmt:check
      - name: S2 daemon lint
        working-directory: daemon
        run: golangci-lint run
      - run: pnpm dashboard:fmt:check
      - run: pnpm dashboard:lint
      - run: pnpm dashboard:depcruise
      - run: pnpm scan:dashboard-source
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow-lint:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/lint-workflows@dc858360aa7812db61fd9d825943e4efd4dcd0e7  # v2026.17
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secret-scan:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/scan-secrets@dc858360aa7812db61fd9d825943e4efd4dcd0e7  # v2026.17
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependency-vulnerabilities:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/scan-dependencies@dc858360aa7812db61fd9d825943e4efd4dcd0e7  # v2026.17
        with:
          lockfiles: "pnpm-lock.yaml,daemon/go.mod"
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7  # v2026.17
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: B1 pnpm daemon:build darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
        run: pnpm daemon:build
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Windows cross-compile (docs/features/06-experimental-windows.md)
  b1-build-windows:
    name: "B1: Build (Windows)"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: compile daemon for windows/amd64
        working-directory: daemon
        env:
          GOOS: windows
          GOARCH: amd64
        run: go test -exec true ./...
      - name: compile daemon for windows/arm64
        working-directory: daemon
        env:
          GOOS: windows
          GOARCH: arm64
        run: go test -exec true ./...
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-tests:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7  # v2026.17
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: L1 daemon unit tests and coverage
        run: pnpm daemon:test:cover && pnpm daemon:cover:check
      - name: L1 dashboard unit tests and coverage
        run: pnpm dashboard:test:cover && pnpm dashboard:cover:check
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — not a Worker project"

  l3-integration:
    name: "L3: Integration"
    runs-on: macos-26
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7  # v2026.17
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: L3 daemon HTTP/CLI matrices (fake backends)
        run: pnpm test:l2
      - name: L3 embedded dashboard serving
        run: pnpm daemon:build && pnpm test:l2:embed
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l4-e2e:
    name: "L4: E2E"
    runs-on: macos-26
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7  # v2026.17
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/dashboard/package.json') }}
      - name: L4 install Playwright browsers
        run: pnpm --filter @meowth/dashboard e2e:install
      - name: L4 Playwright (UI + embed + embed-mint)
        run: pnpm --filter @meowth/dashboard e2e --project=dashboard-ui --project=dashboard-embed --project=dashboard-embed-mint
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  p1-package-check:
    name: "P1: Package Check"
    if: ${{ vars.ENABLE_P1 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — private packages, not published to npm"

  z1-gate:
    name: "Z1: Gate"
    runs-on: ubuntu-latest
    needs:
      - s1-typecheck
      - s2-lint
      - s3-workflow-lint
      - g1-secret-scan
      - g2-dependency-vulnerabilities
      - b1-build
      - b1-build-windows
      - l1-unit-tests
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package-check
    if: always()
    steps:
      - name: "Z1: Require every implemented slot job on this commit"
        env:
          S1_RESULT: ${{ needs.s1-typecheck.result }}
          S2_RESULT: ${{ needs.s2-lint.result }}
          S3_RESULT: ${{ needs.s3-workflow-lint.result }}
          G1_RESULT: ${{ needs.g1-secret-scan.result }}
          G2_RESULT: ${{ needs.g2-dependency-vulnerabilities.result }}
          B1_RESULT: ${{ needs.b1-build.result }}
          B1_WIN_RESULT: ${{ needs.b1-build-windows.result }}
          L1_RESULT: ${{ needs.l1-unit-tests.result }}
          L2_RESULT: ${{ needs.l2-runtime.result }}
          L3_RESULT: ${{ needs.l3-integration.result }}
          L4_RESULT: ${{ needs.l4-e2e.result }}
          P1_RESULT: ${{ needs.p1-package-check.result }}
          S1_SHA: ${{ needs.s1-typecheck.outputs.tested-sha }}
          S2_SHA: ${{ needs.s2-lint.outputs.tested-sha }}
          S3_SHA: ${{ needs.s3-workflow-lint.outputs.tested-sha }}
          G1_SHA: ${{ needs.g1-secret-scan.outputs.tested-sha }}
          G2_SHA: ${{ needs.g2-dependency-vulnerabilities.outputs.tested-sha }}
          B1_SHA: ${{ needs.b1-build.outputs.tested-sha }}
          B1_WIN_SHA: ${{ needs.b1-build-windows.outputs.tested-sha }}
          L1_SHA: ${{ needs.l1-unit-tests.outputs.tested-sha }}
          L3_SHA: ${{ needs.l3-integration.outputs.tested-sha }}
          L4_SHA: ${{ needs.l4-e2e.outputs.tested-sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          require_success() {
            local label="$1" result="$2"
            if [ "$result" != success ]; then
              echo "::error::Z1: Gate — $label result was '$result' (expected success)."
              exit 1
            fi
          }
          require_skipped() {
            local label="$1" result="$2"
            if [ "$result" != skipped ]; then
              echo "::error::Z1: Gate — $label result was '$result' (expected skipped)."
              exit 1
            fi
          }
          require_success "S1: Types" "$S1_RESULT"
          require_success "S2: Lint" "$S2_RESULT"
          require_success "S3: Workflow" "$S3_RESULT"
          require_success "G1: Secrets" "$G1_RESULT"
          require_success "G2: Dependencies" "$G2_RESULT"
          require_success "B1: Build" "$B1_RESULT"
          require_success "B1: Build (Windows)" "$B1_WIN_RESULT"
          require_success "L1: Unit" "$L1_RESULT"
          require_skipped "L2: Runtime" "$L2_RESULT"
          require_success "L3: Integration" "$L3_RESULT"
          require_success "L4: E2E" "$L4_RESULT"
          require_skipped "P1: Package Check" "$P1_RESULT"
          for sha in "$S1_SHA" "$S2_SHA" "$S3_SHA" "$G1_SHA" "$G2_SHA" "$B1_SHA" "$B1_WIN_SHA" "$L1_SHA" "$L3_SHA" "$L4_SHA"; do
            if [ "$sha" != "$EXPECTED_SHA" ]; then
              echo "::error::Z1: Gate — tested-sha mismatch (got '$sha', expected '$EXPECTED_SHA')."
              exit 1
            fi
          done
          echo "Z1: Gate — all slots match declaration on $EXPECTED_SHA"
