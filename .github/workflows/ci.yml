# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, L2, L3, Z1 on macOS jobs;
# na L1.5, P1. quality.yml 不适用：Go 守护进程 + macos-26 runner、darwin 矩阵构建与 Windows 交叉编译，shared inputs 无法表达。nocoo/base-ci v2026.12。
name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── S1: Typecheck ──
  s1-typecheck:
    name: "S1: Typecheck"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: S1 dashboard typecheck
        run: pnpm dashboard:typecheck
      - name: S1 daemon vet
        run: pnpm daemon:vet

  # ── S2: Lint ──
  s2-lint:
    name: "S2: Lint"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Install ripgrep
        run: brew install ripgrep
      - run: pnpm test:hooks
      - run: pnpm daemon:fmt:check
      - run: pnpm daemon:lint
      - run: pnpm dashboard:fmt:check
      - run: pnpm dashboard:lint
      - run: pnpm dashboard:depcruise
      - run: pnpm scan:dashboard-source

  # ── S3: Workflow Lint ──
  s3-workflow-lint:
    name: "S3: Workflow Lint"
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      yamllint: true

  # ── G1: Secret Scan ──
  g1-secret-scan:
    name: "G1: Secret Scan"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: G1 gitleaks detect
        run: pnpm scan:gitleaks:detect

  # ── G2: Dependency Vulnerabilities ──
  g2-dependency-vulnerabilities:
    name: "G2: Dependency Vulnerabilities"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: Install osv-scanner
        run: brew install osv-scanner
      - name: G2 OSV lockfile scan
        run: pnpm scan:osv
      - name: G2 govulncheck
        run: pnpm scan:govulncheck

  # ── B1: Build ──
  b1-build:
    name: "B1: Build"
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: B1 pnpm daemon:build darwin/${{ matrix.goarch }}
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: pnpm daemon:build

  # ── L1: Unit Tests & Coverage ──
  l1-unit-tests:
    name: "L1: Unit Tests & Coverage"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: Install ripgrep
        run: brew install ripgrep
      - name: L1 daemon unit tests and coverage
        run: pnpm daemon:test:cover && pnpm daemon:cover:check
      - name: L1 dashboard unit tests and coverage
        run: pnpm dashboard:test:cover && pnpm dashboard:cover:check

  # ── L2: API E2E ──
  l2-api-e2e:
    name: "L2: API E2E"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - name: L2 daemon HTTP/CLI matrices (fake backends)
        run: pnpm test:l2
      - name: L2 embedded dashboard serving
        run: pnpm daemon:build && pnpm test:l2:embed

  # ── L3: Browser E2E ──
  l3-browser-e2e:
    name: "L3: Browser E2E"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "26.12.1"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/dashboard/package.json') }}
      - name: L3 install Playwright browsers
        run: pnpm --filter @meowth/dashboard e2e:install
      - name: L3 Playwright (UI + embed + embed-mint)
        run: pnpm --filter @meowth/dashboard e2e --project=dashboard-ui --project=dashboard-embed --project=dashboard-embed-mint

  # 槽位外：实验性 Windows 交叉编译冒烟（docs/features/06-experimental-windows.md）
  compile-windows:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: compile daemon for windows/${{ matrix.goarch }}
        working-directory: daemon
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go test -exec true ./...

  # ── Z1: Gate ──
  z1-gate:
    name: "Z1: Gate"
    runs-on: ubuntu-latest
    needs:
      - s1-typecheck
      - s2-lint
      - s3-workflow-lint
      - g1-secret-scan
      - g2-dependency-vulnerabilities
      - b1-build
      - l1-unit-tests
      - l2-api-e2e
      - l3-browser-e2e
      - compile-windows
    if: always()
    steps:
      - name: Z1 aggregate slot jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = [job for job, meta in needs.items() if meta.get("result") != "success"]
          if bad:
              print("CI slot jobs not successful:", ", ".join(bad))
              sys.exit(1)
          print("All CI slot jobs succeeded.")
          PY
