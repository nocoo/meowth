# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1–S3, G1–G2, B1, L1, L2, L3, Z1 on macOS jobs;
# na L1.5, P1 (skipped)。检查名前缀 quality / 与 fan-out 一致；命令逻辑不变。nocoo/base-ci v2026.12。
name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-macos.yml
