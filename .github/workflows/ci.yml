# Phase 2.12 — CI / 6DQ gates on GitHub-hosted macOS.

name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Print runner identity (pre-setup)
        run: |
          uname -m
          sw_vers
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "22.23.2"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Print toolchain identity (post-setup)
        run: |
          node -v
          pnpm -v
          go version
      - name: Install ripgrep
        run: brew install ripgrep
      - run: pnpm daemon:g1
      - run: pnpm dashboard:g1

  build-darwin:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "22.23.2"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: pnpm daemon:build darwin/${{ matrix.goarch }}
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: pnpm daemon:build

  compile-windows:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: compile daemon for windows/${{ matrix.goarch }}
        working-directory: daemon
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go test -exec true ./...

  l1-daemon:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "22.23.2"
          install-policy: "blocked"
      - run: pnpm daemon:test:cover
      - run: pnpm daemon:cover:check

  l1-dashboard:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "22.23.2"
          install-policy: "blocked"
      - name: Install ripgrep
        run: brew install ripgrep
      - run: pnpm dashboard:test:cover
      - run: pnpm dashboard:cover:check

  l2:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "22.23.2"
          install-policy: "blocked"
      - run: pnpm test:l2

  l2-embed:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "22.23.2"
          install-policy: "blocked"
      - run: pnpm daemon:build
      - run: pnpm test:l2:embed

  l3:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "22.23.2"
          install-policy: "blocked"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/dashboard/package.json') }}
      - run: pnpm --filter @meowth/dashboard e2e:install
      - name: L3 Playwright (UI + embed + embed-mint)
        run: pnpm --filter @meowth/dashboard e2e --project=dashboard-ui --project=dashboard-embed --project=dashboard-embed-mint

  g2:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "22.23.2"
          install-policy: "blocked"
      - name: Install osv-scanner
        run: brew install osv-scanner
      - run: pnpm scan:osv
      - run: pnpm scan:govulncheck

  secret-scan:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum
      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
        with:
          package-manager: "pnpm"
          runtime-version: "11.6.0"
          node-version: "22.23.2"
          install-policy: "blocked"
      - run: pnpm scan:gitleaks:detect
