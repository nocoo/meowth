# CI slot standard v1.3.0 (system1-quality): impl S1-S3, G1-G2, B1, L1, L3, L4, Z1 on macOS jobs;
# na L2, P1 (skipped). Check names prefix `quality / `; command logic unchanged. nocoo/base-ci v2026.15.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml
